"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "blackthorn-rugby"
main = "src/index.ts"
compatibility_date = "2026-11-08"
upload_source_maps = true

[observability]
enabled = true

[observability.traces]
enabled = true

# Replace database_id after `wrangler d1 create blackthorn-rugby`.
# Do not put a Cloudflare account id in this file.
[[d1_databases]]
binding = "DB"
database_name = "blackthorn-rugby"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/auth/*", "/health" ]

# Production email. Leave EMAIL_PROVIDER unset (or set it to cloudflare) after the
# sending domain is onboarded. Do not set remote = true here; that would send real
# mail from local development. Local tests use EMAIL_PROVIDER=console instead.
[[send_email]]
name = "EMAIL"

# Photos are out of scope this offseason. Do not add an R2 binding.

# Daily job at 12:00 UTC (07:00 EST / 08:00 EDT). It opens and closes challenges and,
# on Mondays, sends the previous week's recap. Leave this commented until the owner
# deploys. The handler is in src/index.ts. See docs/DEPLOYMENT.md.
# [triggers]
# crons = ["0 12 * * *"]
